# Dongle Smart Contract — Continuous Integration
#
# Full prose documentation for this pipeline lives in docs/CI_CD.md: the job
# graph, what each job checks and why, the build targets covered, caching, and
# how to reproduce every step locally. Keep docs/CI_CD.md §3 and §4 in sync
# with this file in the same PR whenever a job is added, removed, or changed.
#
# Job overview (all start in parallel unless a `needs:` says otherwise):
#   validate-manifest   - schema-check deployments.json
#   validate-changelog  - Keep a Changelog conventions + validator self-tests
#   pre-commit-hooks    - verify .pre-commit-config.yaml hooks execute (#872)
#   fmt                 - cargo fmt --all -- --check
#   wasm-check          - early no_std compile to wasm32-unknown-unknown
#   clippy              - cargo clippy (WASM target, --all-features, -D warnings)
#   audit               - cargo deny check (security vulnerabilities + license)
#   test               - cargo test on the native host (soroban testutils host)
#   build              - release WASM build            [needs fmt, clippy, test, wasm-check]
#   optimize           - wasm-opt + upload artifact    [needs build]
#   compat             - Rust 1.70 / 1.74 / stable x Linux / macOS / Windows:
#                        tests, WASM build and WASM optimization check (#871)
#
# Toolchain is pinned by rust-toolchain.toml (1.85.0). The global
# RUSTFLAGS: "-D warnings" below promotes every rustc warning to an error for
# EVERY job, not just clippy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  validate-manifest:
    name: Validate Deployment Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validation script
        run: python3 scripts/validate_deployments.py

  validate-changelog:
    name: Validate Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CHANGELOG.md format (Keep a Changelog)
        run: python3 scripts/validate_changelog.py
      - name: Run changelog validator self-tests
        run: python3 scripts/test_validate_changelog.py

  pre-commit-hooks:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install pre-commit
        run: pip install pre-commit pyyaml

      - name: Verify hooks execute
        run: python3 scripts/test_pre_commit_hooks.py

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Early WASM build check (#513): compile to wasm32-unknown-unknown before
  # running the full test suite so that std-only code (which compiles on the
  # host target but fails in WASM) is caught as quickly as possible.
  wasm-check:
    name: WASM Build Check (no_std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-check-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'dongle-smartcontract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-check-

      - name: Build WASM (release) — catch no_std incompatibilities early
        run: cargo build -p dongle-contract --target wasm32-unknown-unknown --release

      - name: Verify WASM binary exists
        run: |
          WASM=target/wasm32-unknown-unknown/release/dongle_contract.wasm
          if [ ! -f "$WASM" ]; then
            echo "ERROR: WASM binary not found at $WASM" >&2
            exit 1
          fi
          echo "WASM binary produced: $(du -h $WASM | cut -f1) at $WASM"

  clippy:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'dongle-smartcontract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-

      - name: Run clippy
        run: cargo clippy -p dongle-contract --target wasm32-unknown-unknown --all-features -- -D warnings

  # Security audit (#716): scan all dependencies for known vulnerabilities
  # using cargo-deny (covers RustSec advisory DB) and validate license
  # compliance.  Runs on every PR and push to main.
  # Update schedule: dependency review should be performed quarterly by
  # running `cargo update` and reviewing the diff in a dedicated PR.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          manifest-path: Cargo.toml

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'dongle-smartcontract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-

      - name: Run tests
        run: cargo test -p dongle-contract

  fuzz:
    name: Fuzz (proptest harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'dongle-smartcontract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Run fuzz harness
        run: cargo test -p dongle-contract fuzz_test_harness

      - name: Upload proptest regressions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: dongle-smartcontract/proptest-regressions/

  build:
    name: Build Contract
    runs-on: ubuntu-latest
    needs: [fmt, clippy, audit, test, wasm-check]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-build-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'dongle-smartcontract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build WASM release
        run: cargo build -p dongle-contract --target wasm32-unknown-unknown --release

  optimize:
    name: Optimize WASM
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-optimize-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'dongle-smartcontract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-optimize-

      # Installed as a prebuilt release binary rather than `cargo install
      # stellar-cli`: the published crate now declares an MSRV newer than the
      # toolchain this repository pins in rust-toolchain.toml, so building it
      # from source fails immediately. The prebuilt binary already bundles
      # wasm-opt (the `opt` feature) and installs in seconds instead of minutes.
      - name: Install Stellar CLI (prebuilt, includes wasm-opt)
        env:
          STELLAR_CLI_VERSION: 27.1.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          curl -sSfL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/stellar-cli"
          echo "$RUNNER_TEMP/stellar-cli" >> "$GITHUB_PATH"

      - name: Verify Stellar CLI
        run: stellar --version

      - name: Build WASM release
        run: cargo build -p dongle-contract --target wasm32-unknown-unknown --release

      - name: Optimize WASM
        run: bash scripts/optimize_wasm.sh

      - name: Upload optimized artifact
        uses: actions/upload-artifact@v4
        with:
          name: dongle_contract_optimized
          path: target/wasm32-unknown-unknown/release/dongle_contract.optimized.wasm

  # Compatibility matrix (#871): verify the contract across Rust versions and
  # host platforms. Every matrix cell reports as its own PR status check
  # ("Compat (<os>, <rust>)"). RUSTUP_TOOLCHAIN overrides the channel pinned
  # in rust-toolchain.toml so each cell really uses its matrix toolchain.
  # 1.70 and 1.74 are older than the MSRV of the pinned soroban-sdk and the
  # v4 Cargo.lock format, so they are reported but do not block merging.
  compat:
    name: Compat (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.rust != 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.70", "1.74", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-compat-${{ matrix.rust }}-${{ hashFiles('Cargo.lock', 'dongle-smartcontract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-compat-${{ matrix.rust }}-

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Run tests
        run: cargo test -p dongle-contract

      - name: Build WASM release
        run: cargo build -p dongle-contract --target wasm32-unknown-unknown --release

      # Binaryen from npm ships a wasm-opt CLI on every runner OS, so the
      # same optimization check runs on Linux, macOS and Windows.
      - name: Install wasm-opt (Binaryen)
        run: npm install -g binaryen@116.0.0

      - name: Optimize WASM
        run: bash scripts/optimize_wasm.sh
