[package]
name = "dongle-contract"
version = "0.6.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
proptest = "1.0"

[features]
testutils = ["soroban-sdk/testutils"]

# Build profiles are defined at the workspace root (../Cargo.toml); Cargo ignores
# `[profile.*]` in non-root members and warns when they are present here.
